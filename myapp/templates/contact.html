{% extends 'base.html' %}
{% block content %}
<div class="container section-padding">
    <div class="card card-modern p-5">
        <h2 class="fw-bold mb-4">Contact Us</h2>

        <form>
            <div class="mb-3">
                <input type="text" class="form-control rounded-3" placeholder="Your Name">
            </div>
            <div class="mb-3">
                <input type="email" class="form-control rounded-3" placeholder="Your Email">
            </div>
            <div class="mb-3">
                <textarea class="form-control rounded-3" rows="4" placeholder="Message"></textarea>
            </div>
            <button class="btn btn-primary btn-modern">Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
