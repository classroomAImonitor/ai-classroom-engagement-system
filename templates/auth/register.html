{% extends "auth_base.html" %}

{% block title %}Join Neural Network - AI Classroom Engagement{% endblock %}

{% block auth_content %}
<form method="post" action="{% url 'register' %}">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" class="form-control" id="id_username" name="username" required>
        <div class="form-text">Required. 150 characters or fewer.</div>
    </div>
    
    <div class="mb-3">
        <label for="id_email" class="form-label">Email</label>
        <input type="email" class="form-control" id="id_email" name="email" required>
    </div>
    
    <div class="mb-3">
        <label for="id_password1" class="form-label">Password</label>
        <input type="password" class="form-control" id="id_password1" name="password1" required>
        <div class="form-text">
            Your password must contain at least 8 characters.
        </div>
    </div>
    
    <div class="mb-3">
        <label for="id_password2" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="id_password2" name="password2" required>
    </div>
    
    <div class="mb-3">
        <label for="captcha" class="form-label">Captcha</label>
        <div class="input-group">
            <input type="text" class="form-control" id="captcha" placeholder="Enter captcha" required>
            <span class="input-group-text bg-light">
                <strong>B4KP</strong>
            </span>
        </div>
    </div>
    
    <div class="d-grid">
        <button type="submit" class="btn btn-primary btn-lg">Join Neural Network</button>
    </div>
</form>

<div class="auth-footer">
    <p class="mb-0">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
